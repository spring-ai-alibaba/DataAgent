server:
  port: 8065

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 存储 DataAgent 业务数据的数据库，并非Agent分析数据的来源
spring:
  elasticsearch:
    uris: ${DATA_AGENT_ELASTICSEARCH_URIS:http://127.0.0.1:9200}
    username: ${DATA_AGENT_ELASTICSEARCH_USERNAME:elastic}
    password: ${DATA_AGENT_ELASTICSEARCH_PASSWORD:}
  datasource:
    url: ${DATA_AGENT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/saa_data_agent?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DATA_AGENT_DATASOURCE_USERNAME:root}
    password: ${DATA_AGENT_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DATA_AGENT_DATASOURCE_SQL_INIT:never}
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true
      separator: ;
      encoding: utf-8
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      type: elasticsearch
      elasticsearch:
        index-name: spring-ai-document-index
        initialize-schema: true
        dimensions: 1024
        similarity: cosine
    alibaba:
      data-agent:
        vector-store:
          enable-hybrid-search: true
          elasticsearch-min-score: 0.5
          table-topk-limit: ${DATA_AGENT_TABLE_TOPK_LIMIT:50}
          schema-recall-max-retries: ${DATA_AGENT_SCHEMA_RECALL_MAX_RETRIES:2}
          schema-recall-retry-backoff: ${DATA_AGENT_SCHEMA_RECALL_RETRY_BACKOFF:500ms}
          table-similarity-threshold: 0.2
          default-topk-limit: 8
          default-similarity-threshold: 0.4
        lineage:
          enabled: ${DATA_AGENT_LINEAGE_ENABLED:true}
          max-source-rows: ${DATA_AGENT_LINEAGE_MAX_SOURCE_ROWS:100}
          file-name-columns: ${DATA_AGENT_LINEAGE_FILE_NAME_COLUMNS:source_file_name,source_filename}
          file-hash-columns: ${DATA_AGENT_LINEAGE_FILE_HASH_COLUMNS:source_file_sha256}
          sheet-columns: ${DATA_AGENT_LINEAGE_SHEET_COLUMNS:source_sheet}
          imported-at-columns: ${DATA_AGENT_LINEAGE_IMPORTED_AT_COLUMNS:source_imported_at,imported_at,created_at}
          platform-columns: ${DATA_AGENT_LINEAGE_PLATFORM_COLUMNS:source_platform}
          source-type-columns: ${DATA_AGENT_LINEAGE_SOURCE_TYPE_COLUMNS:source_type}
          uri-columns: ${DATA_AGENT_LINEAGE_URI_COLUMNS:source_uri,source_url}
          resource-id-columns: ${DATA_AGENT_LINEAGE_RESOURCE_ID_COLUMNS:source_resource_id}
          version-columns: ${DATA_AGENT_LINEAGE_VERSION_COLUMNS:source_version}
          acquired-at-columns: ${DATA_AGENT_LINEAGE_ACQUIRED_AT_COLUMNS:source_acquired_at,acquired_at}
          artifact-format-columns: ${DATA_AGENT_LINEAGE_ARTIFACT_FORMAT_COLUMNS:artifact_format,source_format}
          ingestion-tool-columns: ${DATA_AGENT_LINEAGE_INGESTION_TOOL_COLUMNS:ingestion_tool}
        llm-service-type: stream
        code-executor:
          # 运行Python代码的环境（生产环境建议使用docker，不建议使用local）
          code-pool-executor: docker
          image-name: continuumio/anaconda3:latest
          limit-memory: 1024
          cpu-core: 1
          max-concurrent-tasks: 3
          network-mode: none
          code-timeout: 60s
          # Python执行的最大重试次数
          python-max-tries-count: 5
        file:
          type: local
          path-prefix: data-agent
          # 当前目录下不要用点， ./uploads win下拼接完整格式路径会解析不了，比如 data-agent/./uploads win识别不了
          path: uploads
          url-prefix: /uploads
          imageSize: 2097152
          oss:
            access-key-id: ${OSS_ACCESS_KEY_ID:}
            access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
            endpoint: ${OSS_ENDPOINT:}
            bucket-name: ${OSS_BUCKET_NAME:}
            custom-domain: ${OSS_CUSTOM_DOMAIN:}
        max-sql-retry-count: 10
        # Langfuse 可观测性配置
        langfuse:
          enabled: ${LANGFUSE_ENABLED:false}
          host: ${LANGFUSE_HOST:}
          public-key: ${LANGFUSE_PUBLIC_KEY:}
          secret-key: ${LANGFUSE_SECRET_KEY:}
  webflux:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
      enabled: true

mybatis:

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging:
  level:
    com.alibaba.cloud.ai.dataagent.service: debug
    com.alibaba.cloud.ai.dataagent.workflow.node: debug
    com.alibaba.cloud.ai.mapper: debug
    org.springframework.jdbc: debug
